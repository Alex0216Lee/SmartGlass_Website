services:
  web:
    build: .
    container_name: smart-glasses-app
    env_file:
      - .env
    ports:
      - "5002:5002"
    volumes:
      - ./uploads:/app/uploads
      # 可以改output路徑
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

